<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>星穹铁道 · 群星跃迁</title>
    <script src="qrc:///qtwebchannel/qwebchannel.js">
    </script>
    <style>
        /* ===== 全局重置 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "DIN Medium", "DINPro-Medium", "HYQiHei 65S", "HYQiHei-65S", "汉仪旗黑 65", "PingFang SC", "Microsoft Yahei", sans-serif;
            font-weight: 500;
        }
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #0e101a;
            color: #fff;
            user-select: none;
        }
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 4px;
        }
        .gacha-wrap {
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at 30% 40%, #1a1e32, #0d0f1a);
            position: relative;
            overflow: hidden;
        }
        .gacha-wrap.disabled {
            pointer-events: none;
        }
        .gacha-wrap::before {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(10, 12, 26, 0.40);
            pointer-events: none;
            z-index: 0;
        }
        .header-title {
            position: absolute;
            top: 20px;
            left: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 10;
        }
        .logo-icon {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, #d4bc88, #b89f6a);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #1a1a2e;
            font-size: 22px;
            box-shadow: 0 4px 16px rgba(212, 188, 136, 0.2);
        }
        /* 卡池时间面板（编辑模式） */
        #poolTimePanel {
            position: fixed; right: 18px; top: 96px; z-index: 99997; width: 268px;
            padding: 12px 14px; border-radius: 12px; font-size: 13px; color: #ddd;
            background: rgba(16, 18, 26, .95); border: 1px solid rgba(255, 255, 255, .16);
            box-shadow: 0 10px 30px rgba(0, 0, 0, .5); backdrop-filter: blur(8px);
        }
        #poolTimePanel .ptp-title { color: #ffd76a; font-weight: 600; margin-bottom: 8px; }
        #poolTimePanel label { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
        #poolTimePanel input[type="datetime-local"] {
            flex: 1; min-width: 0; background: rgba(255, 255, 255, .08); color: #eee;
            border: 1px solid rgba(255, 255, 255, .18); border-radius: 6px; padding: 4px 6px;
            font-size: 12px;
        }
        #poolTimePanel .ptp-quick { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 6px; }
        #poolTimePanel .ptp-quick button {
            padding: 4px 8px; font-size: 12px; border-radius: 6px; cursor: pointer;
            background: rgba(255, 255, 255, .1); color: #eee;
            border: 1px solid rgba(255, 255, 255, .18);
        }
        #poolTimePanel .ptp-quick button:hover { background: rgba(255, 255, 255, .2); }
        #poolTimePanel .ptp-state { color: #8fd6a0; margin-bottom: 4px; }
        #poolTimePanel .ptp-hint { color: #8a8a8a; font-size: 11px; line-height: 1.5; }

        /* 编辑条（全自定义模式） */
        #editBar {
            position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%);
            display: flex; align-items: center; gap: 10px; z-index: 99998;
            padding: 10px 16px; border-radius: 12px;
            background: rgba(16, 18, 26, .95); border: 1px solid rgba(255, 255, 255, .16);
            box-shadow: 0 10px 30px rgba(0, 0, 0, .5); backdrop-filter: blur(8px);
            font-size: 13px; color: #ddd; white-space: nowrap;
        }
        #editBar .eb-title { color: #ffd76a; font-weight: 600; }
        #editBar .eb-hint { color: #9a9a9a; }
        #editBar .eb-btn {
            padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 13px;
            background: rgba(255, 255, 255, .1); color: #eee;
            border: 1px solid rgba(255, 255, 255, .18);
        }
        #editBar .eb-btn:hover { background: rgba(255, 255, 255, .18); }
        #editBar .eb-primary { background: #3d7a3d; border-color: #4c9a4c; }
        #editBar .eb-primary:hover { background: #4a914a; }
        #editBar .eb-danger { background: #7a3d3d; border-color: #9a4c4c; }
        #editBar .eb-danger:hover { background: #914a4a; }
        .pool-add-item { opacity: .9; border: 1px dashed rgba(255, 255, 255, .3) !important; }

        /* 页面内提示条（替代 Qt 弹窗） */
        .gacha-toast {
            position: fixed; left: 50%; top: 18px; transform: translate(-50%, -12px);
            min-width: 240px; max-width: 68vw; padding: 10px 18px 12px;
            background: rgba(18, 20, 28, 0.94); border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 10px; color: #ececec; font-size: 14px; z-index: 99999;
            opacity: 0; pointer-events: none; transition: all .22s ease;
            box-shadow: 0 8px 26px rgba(0, 0, 0, .45); backdrop-filter: blur(6px);
        }
        .gacha-toast.show { opacity: 1; transform: translate(-50%, 0); }
        .gacha-toast.error { border-color: rgba(255, 90, 90, .55); color: #ffb4b4; }
        .gacha-toast.ok { border-color: rgba(120, 220, 140, .5); color: #b7f0c4; }
        .gacha-toast .gt-bar {
            display: none; height: 4px; margin-top: 8px; border-radius: 2px;
            background: rgba(255, 255, 255, .12); overflow: hidden;
        }
        .gacha-toast .gt-fill {
            height: 100%; width: 0; border-radius: 2px;
            background: linear-gradient(90deg, #6ea8ff, #b98bff); transition: width .2s linear;
        }
        .title-text h3 {
            font-size: 20px;
            color: #e6d7b8;
            letter-spacing: 3px;
            font-weight: 500;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.5);
        }
        .title-text p {
            font-size: 12px;
            color: rgba(201, 184, 152, 0.7);
            letter-spacing: 2px;
        }
        .res-top-right {
            position: absolute;
            top: 20px;
            right: 24px;
            display: flex;
            gap: 16px;
            align-items: center;
            z-index: 10;
        }
        .res-item {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(0, 0, 0, 0.5);
            padding: 4px 12px;
            border-radius: 8px;
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            font-size: 14px;
        }
        .res-item img {
            width: 24px;
            height: 24px;
            object-fit: contain;
            display: block;
        }
        .res-num {
            font-weight: 500;
            min-width: 20px;
            text-align: center;
            color: #e6d7b8;
        }
        .left-pool-list {
            position: absolute;
            top: 84px;
            left: 18px;
            display: flex;
            flex-direction: column;
            /* 侧边卡池之间留出更明显的间隔 */
            gap: 24px;
            z-index: 5;
            width: 156px;
        }
        .pool-item {
            width: 100%;
            height: 64px;
            border-radius: 8px;
            overflow: hidden;
            cursor: default;
            position: relative;
            background: rgba(26, 30, 50, 0.7);
            border: 2px solid rgba(74, 74, 106, 0.5);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px;
        }
        .pool-item.active {
            border-color: #e6c87a;
            box-shadow: 0 0 0 1px rgba(230, 200, 122, 0.2), 0 6px 28px rgba(230, 200, 122, 0.06);
        }
        .pool-item .ticket-text {
            font-size: 15px;
            font-weight: 600;
            color: #e6d7b8;
            text-align: center;
            letter-spacing: 1px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
            z-index: 2;
            padding: 0 8px;
            line-height: 1.3;
        }
        .pool-item .ticket-text small {
            display: block;
            font-size: 11px;
            font-weight: 400;
            color: rgba(201, 184, 152, 0.6);
            letter-spacing: 0.5px;
        }
        .pool-item::before,
        .pool-item::after {
            content: "";
            position: absolute;
            top: 6px;
            bottom: 6px;
            width: 5px;
            background: repeating-conic-gradient(rgba(26, 30, 50, 0.6) 0% 25%, transparent 0% 50%) 0 0 / 5px 10px;
            opacity: 0.5;
            pointer-events: none;
            z-index: 1;
        }
        .pool-item::before {
            left: 4px;
        }
        .pool-item::after {
            right: 4px;
        }
        .pool-item .ticket-inner {
            position: absolute;
            top: 5px;
            left: 13px;
            right: 13px;
            bottom: 5px;
            border: 1px solid rgba(230, 200, 122, 0.06);
            border-radius: 4px;
            pointer-events: none;
            z-index: 1;
        }
        .center-modal {
            position: absolute;
            left: 200px;
            right: 24px;
            top: 84px;
            bottom: 156px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 14px;
            overflow: hidden;
            backdrop-filter: blur(3px);
            border: 1px solid rgba(255, 255, 255, 0.03);
            box-shadow: inset 0 0 60px rgba(0, 0, 0, 0.3);
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .center-modal img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .bottom-area {
            position: absolute;
            bottom: 34px;
            left: 200px;
            right: 24px;
            display: flex;
            justify-content: space-between;
            /* 底部对齐：左侧「历史记录」这一行与右侧抽卡按钮行最底下齐平 */
            align-items: flex-end;
            z-index: 5;
            flex-wrap: wrap;
            gap: 12px;
        }
        .bottom-left-buttons {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 10px;
        }
        .blb-row {
            display: flex;
            /* 历史记录 / 查看详情 / 兑换专票 之间留出间距 */
            gap: 18px;
        }
        .btn-base {
            padding: 8px 28px;
            border-radius: 22px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.04);
            color: #c9b898;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            backdrop-filter: blur(4px);
            letter-spacing: 0.5px;
        }
        .btn-base:hover {
            background: rgba(255, 255, 255, 0.10);
            border-color: rgba(255, 255, 255, 0.25);
            color: #e6d7b8;
        }
        .gacha-buttons {
            display: flex;
            gap: 14px;
        }
        .gacha-btn {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 15px 38px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 999px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.25s;
            backdrop-filter: blur(4px);
            letter-spacing: 0.5px;
            color: #e6d7b8;
        }
        .gacha-btn:hover {
            background: rgba(255, 255, 255, 0.10);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.4);
        }
        .gacha-btn:active {
            transform: scale(0.96) translateY(0);
        }
        .gacha-btn .icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 26px;
            height: 26px;
        }
        .gacha-btn .icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }
        /* [图标] x1 | 跃迁1次 —— 数量与文案之间的分隔线 */
        /* 未公开角标（编辑模式显示在卡池名旁） */
        /* 上方公告文本 */
        .poolinfo-doc { margin-bottom: 12px; }
        .poolinfo-doc h3 {
            margin: 0 0 8px;
            font-size: 14px;
            color: #f0e2be;
            font-weight: 600;
            letter-spacing: 1px;
        }
        .poolinfo-doc h4 {
            margin: 10px 0 4px;
            font-size: 13px;
            color: #ffd76a;
            font-weight: 600;
        }
        .poolinfo-doc p {
            margin: 0 0 6px;
            font-size: 12px;
            line-height: 1.7;
            color: rgba(255, 255, 255, .72);
        }
        /* ===== 卡池详情（可抽物品 + 概率 + 保底） ===== */
        .poolinfo-list { display: flex; flex-direction: column; gap: 10px; }
        .poolinfo-tier {
            background: rgba(255, 255, 255, .04);
            border: 1px solid rgba(255, 255, 255, .08);
            border-radius: 10px;
            padding: 10px 12px;
        }
        .poolinfo-tier h3 { margin: 0 0 6px; font-size: 13px; font-weight: 600; }
        .poolinfo-tier.t5 h3 { color: #f7c948; }
        .poolinfo-tier.t4 h3 { color: #c99bff; }
        .poolinfo-tier.t3 h3 { color: #9fd3ff; }
        .poolinfo-row {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            font-size: 12px;
            color: rgba(255, 255, 255, .78);
            padding: 3px 0;
        }
        .poolinfo-row .pi-name { display: flex; gap: 6px; align-items: center; }
        .poolinfo-row .up-tag {
            color: #f7c948;
            font-size: 10px;
            border: 1px solid rgba(247, 201, 72, .45);
            border-radius: 3px;
            padding: 0 4px;
        }
        .poolinfo-pity {
            margin-top: 4px;
            font-size: 12px;
            color: rgba(255, 255, 255, .6);
        }
        .pool-item .pool-unpub {
            display: inline-block;
            margin-left: 6px;
            font-size: 10px;
            color: #ffb066;
            border: 1px solid rgba(255, 176, 102, .45);
            border-radius: 4px;
            padding: 0 4px;
        }
        .gacha-btn .sep {
            color: rgba(255, 255, 255, 0.18);
            font-weight: 300;
            margin: 0 2px;
        }
        /* UID 一行：右侧紧跟「同步中…」提示 */
        .uid-row {
            position: absolute;
            bottom: 6px;
            left: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 3;
        }
        .uid-text {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.08);
            letter-spacing: 1px;
            font-family: monospace;
        }
        .uid-row .sync-hint {
            margin-left: 0;
            font-size: 12px;
        }
        /* 底部一排：左边是卡池剩余时间（精确到秒），右边是保底次数 */
        .pity-badge, .pool-time-badge {
            position: absolute;
            bottom: 80px;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            padding: 8px 16px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }
        /* 剩余时间徽标：也是「历史记录」按钮上方那一行（往上挪一点点） */
        .pool-time-badge {
            position: static;
            font-family: monospace;
            color: rgba(255, 255, 255, 0.55);
            margin-bottom: 6px;
        }
        .pity-badge {
            right: 28px;
            z-index: 4;
            /* 按要求不再显示保底徽章（元素保留，避免页面脚本取空后报错） */
            display: none !important;
        }
        .pity-badge span {
            color: #e6c87a;
            font-weight: 600;
        }
        #guaranteeHint {
            position: absolute;
            bottom: 128px;
            right: 28px;
            font-size: 12px;
            color: #f7c948;
            background: rgba(247, 201, 72, 0.1);
            padding: 4px 12px;
            border-radius: 6px;
            border: 1px solid rgba(247, 201, 72, 0.15);
            z-index: 4;
            letter-spacing: 0.5px;
            backdrop-filter: blur(4px);
            pointer-events: none;
        }

        /* ===== 视频遮罩 ===== */
        .video-overlay {
            position: fixed;
            inset: 0;
            z-index: 999;
            background: #0a0c18;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            cursor: pointer;
            touch-action: none;
        }
        .video-overlay.open {
            display: flex;
        }
        .video-overlay video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
            display: block;
            pointer-events: none;
        }
        .video-overlay .skip-hint {
            position: absolute;
            bottom: 40px;
            color: rgba(255, 255, 255, 0.2);
            font-size: 13px;
            letter-spacing: 2px;
            animation: pulse 1.8s ease-in-out infinite;
            pointer-events: none;
        }
        @keyframes pulse {
            0%,
            100% {
                opacity: 0.2;
            }
            50% {
                opacity: 0.7;
            }
        }

        /* ===== 抽卡结果弹窗 ===== */
        .gacha-result-popup {
            position: fixed;
            left: 0;
            top: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            z-index: 9999;
            visibility: hidden;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(6px);
        }
        .gacha-result-popup.show {
            visibility: visible;
            opacity: 1;
            pointer-events: auto;
        }
        .gacha-result-popup .close-btn {
            position: absolute;
            top: 24px;
            right: 24px;
            z-index: 10000;
            font-size: 28px;
            color: #fff;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            width: 48px;
            height: 48px;
            cursor: pointer;
            transition: all 0.25s;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
            font-weight: 300;
        }
        .gacha-result-popup .close-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: rotate(90deg);
            color: #fff;
        }
        .gacha-result-popup .popup-inner {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            max-width: 94vw;
            max-height: 94vh;
            width: 100%;
            padding: 20px 24px 12px;
        }
        .gacha-result-popup .result-grid {
            display: grid;
            gap: 14px;
            justify-content: center;
            align-items: center;
            width: fit-content;
            max-width: 100%;
            padding: 12px 0;
        }
        .gacha-result-popup .result-grid.ten {
            grid-template-columns: repeat(5, 200px);
            grid-template-rows: repeat(2, 240px);
        }
        .gacha-result-popup .result-grid.single {
            grid-template-columns: 260px;
            grid-template-rows: 308px;
        }
        .gacha-result-popup .r-item {
            width: 200px;
            height: 240px;
            border-radius: 10px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.03);
            border: 2px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            flex-shrink: 0;
            transition: transform 0.2s;
        }
        .gacha-result-popup .r-item:hover {
            transform: scale(1.02);
        }
        .gacha-result-popup .r-item img {
            width: 100%;
            height: 80%;
            object-fit: contain;
            display: block;
            border: none;
            flex-shrink: 0;
        }
        .gacha-result-popup .r-item .item-label {
            height: 20%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            font-weight: 500;
            color: #e6d7b8;
            letter-spacing: 1px;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.6);
            background: rgba(0, 0, 0, 0.2);
            width: 100%;
            padding: 0 4px;
            text-align: center;
            flex-shrink: 0;
        }
        .gacha-result-popup .r-item .empty-placeholder {
            color: rgba(255, 255, 255, 0.05);
            font-size: 36px;
        }
        .gacha-result-popup .r-item.rarity-5 {
            border-color: rgba(247, 201, 72, 0.4);
            box-shadow: 0 0 50px rgba(247, 201, 72, 0.1);
        }
        .gacha-result-popup .r-item.rarity-4 {
            border-color: rgba(167, 139, 250, 0.3);
            box-shadow: 0 0 40px rgba(167, 139, 250, 0.06);
        }
        .gacha-result-popup .r-item.rarity-3 {
            border-color: rgba(107, 114, 128, 0.15);
        }
        .gacha-result-popup .exchange-info {
            width: 100%;
            text-align: center;
            padding: 8px 16px;
            background: rgba(247, 201, 72, 0.08);
            border: 1px solid rgba(247, 201, 72, 0.15);
            border-radius: 8px;
            color: #f7c948;
            font-size: 14px;
            letter-spacing: 0.5px;
            margin-top: 4px;
            flex-shrink: 0;
            max-width: 820px;
        }
        .gacha-result-popup .exchange-info.hidden {

            <div class="res-item"><img src="imgs/star_rail_ticket.png" alt="星轨专票" onerror="this.style.display='none'"><span class="res-num" id="ticketCount">0</span></div>
            <div class="res-item"><img src="imgs/stellar_jade.png" alt="星琼" onerror="this.style.display='none'"><span class="res-num" id="jadeCount">0</span></div>
        </div>
        <div class="left-pool-list" id="poolList"></div>
        <div class="center-modal" id="centerModal"><div class="cm-placeholder">✦ 群星跃迁 ✦</div></div>
        <div class="pity-badge" id="pityBadge">🎯 保底 <span id="pityCount">0</span> / 80</div>
        <div class="bottom-area">
            <div class="bottom-left-buttons">
                <div class="pool-time-badge" id="poolTimeBadge" title="卡池剩余时间（精确到秒）">距离卡池结束还有:同步中…</div>
                <div class="blb-row">
                    <button class="btn-base" id="historyBtn">历史记录</button>
                    <button class="btn-base" id="poolInfoBtn">查看详情</button>
                    <button class="btn-base" id="exchangeBtn">兑换专票</button>
                </div>
            </div>
            <div class="gacha-buttons" id="gachaButtons">
                <div class="gacha-btn locked" id="gacha1Btn"><span class="icon"><img src="imgs/star_rail_ticket.png" alt="专票"></span><span class="cnt">x1</span><span class="sep">|</span><span class="lbl">跃迁1次</span></div>
                <div class="gacha-btn locked" id="gacha10Btn"><span class="icon"><img src="imgs/star_rail_ticket.png" alt="专票"></span><span class="cnt">x10</span><span class="sep">|</span><span class="lbl">跃迁10次</span></div>
            </div>
        </div>
        <div class="uid-row">
            <div class="uid-text" id="uidDisplay">UID: --</div>
            <span class="sync-hint" id="syncHint">同步中…</span>
        </div>
    </div>

    <!-- 视频遮罩 -->
    <div class="video-overlay" id="videoOverlay">
        <video id="gachaVideo" playsinline webkit-playsinline="true" x5-playsinline="true"></video>
        <button id="skipVideoBtn" style="position:absolute;top:24px;right:24px;z-index:10000;padding:8px 20px;background:rgba(0,0,0,0.6);border:1px solid rgba(255,255,255,0.2);border-radius:20px;color:#fff;font-size:15px;cursor:pointer;backdrop-filter:blur(4px);transition:all 0.2s;font-weight:500;letter-spacing:0.5px;">⏭ 跳过</button>
        <div class="skip-hint">✦ 点击任意区域跳过 ✦</div>
    </div>

    <!-- ===== 抽卡结果弹窗 ===== -->
    <div class="gacha-result-popup" id="gachaResultPopup">
        <div class="popup-inner" id="popupInner"></div>
    </div>

    <!-- ===== 卡池详情（可抽物品 + 概率 + 保底） ===== -->
    <div class="history-overlay" id="poolInfoOverlay">
        <div class="history-modal">
            <div class="history-header"><h2>角色活动跃迁说明</h2><button class="close-history" id="poolInfoClose">✕</button></div>
            <div class="history-body" id="poolInfoBody">
                <div class="empty-msg">加载中…</div>
                <div class="poolinfo-list" id="poolInfoList"></div>
            </div>
        </div>
    </div>

    <!-- ===== 历史记录 ===== -->
    <div class="history-overlay" id="historyOverlay">
        <div class="history-modal">
            <div class="history-header"><h2>📜 抽卡记录</h2><button class="close-history" id="historyClose">✕</button></div>
            <div class="history-body" id="historyBody">
                <div class="empty-msg">还没有抽卡记录，快去跃迁吧 ✦</div>
                <div class="history-list" id="historyList"></div>
            </div>
            <div class="history-pagination" id="historyPagination">
                <button id="historyPrev">‹ 上一页</button>
                <span class="page-info">第 <span id="pageCurrent">1</span> / <span id="pageTotal">1</span> 页</span>
                <button id="historyNext">下一页 ›</button>
            </div>
        </div>
    </div>

    <!-- ===== 兑换窗口 ===== -->
    <div class="exchange-overlay" id="exchangeOverlay">
        <div class="exchange-modal">
            <div class="exchange-header"><h2><span class="icon">💎</span> 星琼兑换专票</h2><button class="exchange-close" id="exchangeClose">✕</button></div>
            <div class="exchange-body" id="exchangeBody"></div>
        </div>
    </div>

    <script>
        // ========== 全局变量 ==========
        let gacha_bridge = null;
        let isBridgeReady = false;
        let isGachaInProgress = false;
        let tickets = 0,
            jades = 0,
            pityCounter = 0,
            isFiveStarGuaranteed = false,
            uid = '--';
        let historyRecords = [];
        const STORAGE_KEY = 'sr_gacha_state_v8';
        let historyPage = 1,
            PAGE_SIZE = 10,
            ONE_MONTH_MS = 30 * 24 * 60 * 60 * 1000;
        let loadFinished = false;

        // DOM 缓存
        let ticketCountEl, jadeCountEl, pityCountEl, uidDisplayEl;
        let videoOverlay, videoEl, skipBtn;
        let historyOverlay, historyList, emptyMsg, historyClose, historyBtn;
        let poolInfoOverlay, poolInfoList, poolInfoClose, poolInfoBtn;
        let exchangeBtn, exchangeOverlay, exchangeBody, exchangeClose;
        let popup, popupInner;

        // ===== 工具 =====
        function getEl(id) { return document.getElementById(id); }

        // ===== 抽卡请求 =====
        window.requestGacha = async function(count) {
            if (!window.gacha_bridge || !isBridgeReady) { toast('桥接加载中，请稍等…'); return; }
            if (isGachaInProgress) { toast('抽卡进行中…'); return; }
            // 多卡池：按当前卡池的货币与消耗校验；单抽/多连次数以卡池配置为准
            if (!(window.__pools || []).length) {
                toast('暂无可用卡池', 'error');
                return;
            }
            const _pool = (typeof getActivePool === 'function') ? (getActivePool() || {}) : {};
            const _costType = _pool.cost_type || 'star_rail_ticket';
            const _costPer = parseInt(_pool.cost_per_pull || 1, 10) || 1;
            const _multi = parseInt(_pool.multi_pull || 10, 10) || 10;
            if (count !== 1 && count !== _multi) {
                toast('该卡池仅支持 1 抽或 ' + _multi + ' 连', 'error');
                return;
            }
            // 只有消耗专票时才用星琼自动兑换补齐
            if (_costType === 'star_rail_ticket' && tickets < count * _costPer) {
                const need = count * _costPer - tickets,
                    cost = need * 160;
                if (jades < cost) { toast('专票不足，且星琼不足以兑换', 'error'); return; }
                if (!(await window.gachaConfirm(
                    `是否将${cost}星琼转化为${need}张星铁专票？`, '兑换', '取消'))) return;
                try {
                    const res = JSON.parse(await gacha_bridge.exchange(need));
                    if (!res.success) { toast('兑换失败', 'error'); return; }
                    // 返回值只是"已提交"，真实余额由 onExchangeResult / onGachaResult 推送
                    if (res.tickets !== undefined && res.tickets !== null) {
                        tickets = res.tickets;
                        if (ticketCountEl) ticketCountEl.textContent = tickets;
                    }
                    if (res.jade !== undefined && res.jade !== null) {
                        jades = res.jade;
                        if (jadeCountEl) jadeCountEl.textContent = jades;
                    }
                } catch (e) { toast('兑换异常', 'error'); return; }
            }
            isGachaInProgress = true;
            window.gacha_bridge.requestGacha(String(window.__activePoolId || ''), count);
        };

        // ===== WebChannel =====
        function initBridge() {
            let retry = 0;
            const check = () => {
                if (!window.qt || !window.qt.webChannelTransport) {
                    if (retry++ < 15) { setTimeout(check, 300); return; }
                    console.error("qt通道超时");
                    return;
                }
                new QWebChannel(qt.webChannelTransport, function(channel) {
                    console.log("✅ WebChannel回调");
                    gacha_bridge = channel.objects.gacha_bridge;
                    window.gacha_bridge = gacha_bridge;
                    isBridgeReady = true;
                    if (gacha_bridge) loadDataAndRender();
                });
            };
            check();
        }

        async function loadDataAndRender() {
            if (loadFinished || !gacha_bridge) return;
            try {
                const data = JSON.parse(await gacha_bridge.getUserInfo());
                if (!data.pity || data.pity === 0) {
                    const p = localStorage.getItem('sr_gacha_pity');
                    if (p !== null) data.pity = parseInt(p);
                    const g = localStorage.getItem('sr_gacha_guaranteed');
                    if (g !== null) data.guaranteed = g === 'true';
                }
                window.updateGachaData(data);
                loadFinished = true;
            } catch (e) { console.error(e); }
            // 加载历史：从服务器拉取并合并本地（服务端按玩家保存 → 汇总了所有卡池的记录）
            try {
                await loadHistoryFromServer();
            } catch (e) { console.error(e); }
        }

        window.updateGachaData = function(data) {
            if (data.tickets !== undefined) { tickets = data.tickets; if (ticketCountEl) ticketCountEl.textContent =
                tickets; }
            if (data.jade !== undefined) { jades = data.jade; if (jadeCountEl) jadeCountEl.textContent = jades; }
            // 服务端推送的库存快照：右上角按绑定的物品显示真实剩余量
            if (data.inventory && typeof data.inventory === 'object') {
                window.__invCache = data.inventory;
            }
            if (typeof refreshResNums === 'function') refreshResNums();
            // 多卡池：客户端推来的各池保底缓存
            if (data.pities && typeof data.pities === 'object') {
                window.__pityCache = data.pities;
                const _cur = (typeof getActivePool === 'function') ? getActivePool() : null;
                const _info = data.pities[window.__activePoolId] || {};
                if (_cur && _info && _info.pity !== undefined) {
                    pityCounter = _info.pity;
                    isFiveStarGuaranteed = !!_info.guaranteed;
                    if (typeof updatePityBadge === 'function') {
                        updatePityBadge(pityCounter, poolPityTotal(_cur));
                    }
                }
            }
            if (data.pity !== undefined) {
                pityCounter = data.pity;
                if (pityCountEl) pityCountEl.textContent = pityCounter;
                localStorage.setItem('sr_gacha_pity', pityCounter);
                const badge = document.getElementById('pityBadge');
                if (badge) {
                    const span = badge.querySelector('span');
                    if (span) {
                        span.textContent = pityCounter;
                        if (pityCounter >= 70) {
                            badge.style.borderColor = 'rgba(247,201,72,0.4)';
                            span.style.color = '#f7c948';
                            badge.style.background = 'rgba(247,201,72,0.08)';
                        } else {
                            badge.style.borderColor = 'rgba(255,255,255,0.06)';
                            span.style.color = '#e6c87a';
                            badge.style.background = 'rgba(0,0,0,0.5)';
                        }
                    }
                }
            }
            if (data.guaranteed !== undefined) {
                isFiveStarGuaranteed = data.guaranteed;
                localStorage.setItem('sr_gacha_guaranteed', isFiveStarGuaranteed ? 'true' : 'false');
                let hint = document.getElementById('guaranteeHint');
                if (isFiveStarGuaranteed && !hint) {
                    const nh = document.createElement('div');
                    nh.id = 'guaranteeHint';
                    nh.textContent = '✦ 大保底已触发 · 下次五星必UP';
                    document.querySelector('.gacha-wrap').appendChild(nh);
                } else if (!isFiveStarGuaranteed && hint) hint.remove();
            }
            if (data.uid) { uid = data.uid; if (uidDisplayEl) uidDisplayEl.textContent = 'UID: ' + uid; }
        };

        // ===== onExchangeResult（兑换专票：只更新余额，不碰抽卡结果）=====
        window.onExchangeResult = function(resp) {
            try {
                if (!resp || !resp.success) {
                    if (resp && resp.reason) toast('兑换失败：' + resp.reason, 'error');
                    return;
                }
                if (resp.tickets !== undefined && resp.tickets !== null) {
                    tickets = resp.tickets;
                    if (ticketCountEl) ticketCountEl.textContent = tickets;
                }
                if (resp.jade !== undefined && resp.jade !== null) {
                    jades = resp.jade;
                    if (jadeCountEl) jadeCountEl.textContent = jades;
                }
                if (resp.pity !== undefined && resp.pity !== null) {
                    pityCounter = resp.pity;
                    if (pityCountEl) pityCountEl.textContent = pityCounter;
                }
            } catch (e) { console.log('onExchangeResult', e); }
        };

        // ===== onGachaResult =====
        window.onGachaResult = function(resp) {
            try {
                console.log("后端返回完整抽卡数据", resp);
                if (!resp.success) { toast('抽卡失败：' + (resp.reason || ''), 'error');
                    isGachaInProgress = false; return; }
                if (!resp.results) resp.results = [];

                // 如果结果为空，提示并释放锁
                if (resp.results.length === 0) {
                    toast('抽卡结果为空，请联系管理员', 'error');
                    isGachaInProgress = false;
                    return;
                }

                tickets = resp.tickets;
                jades = resp.jade;
                pityCounter = resp.pity;
                isFiveStarGuaranteed = resp.guaranteed;
                if (ticketCountEl) ticketCountEl.textContent = tickets;
                if (jadeCountEl) jadeCountEl.textContent = jades;
                if (pityCountEl) pityCountEl.textContent = pityCounter;
                const badge = document.getElementById('pityBadge');
                if (badge) {
                    const span = badge.querySelector('span');
                    if (span) {
                        span.textContent = pityCounter;
                        if (pityCounter >= 70) {
                            badge.style.borderColor = 'rgba(247,201,72,0.4)';
                            span.style.color = '#f7c948';
                            badge.style.background = 'rgba(247,201,72,0.08)';
                        } else {
                            badge.style.borderColor = 'rgba(255,255,255,0.06)';
                            span.style.color = '#e6c87a';
                            badge.style.background = 'rgba(0,0,0,0.5)';
                        }
                    }
                }
                let hint = document.getElementById('guaranteeHint');
                if (isFiveStarGuaranteed && !hint) {
                    const nh = document.createElement('div');
                    nh.id = 'guaranteeHint';
                    nh.textContent = '✦ 大保底已触发 · 下次五星必UP';
                    document.querySelector('.gacha-wrap').appendChild(nh);
                } else if (!isFiveStarGuaranteed && hint) hint.remove();

                // 写入历史记录
                const now = new Date(),
                    t = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
                resp.results.forEach(r => {
                    const _pn = (getActivePool() || {}).name || '';
                    historyRecords.push({ name: r.name || '未知', rarity: r.rarity || 3, time: t, isUp: !!r.isUp,
                        isGuaranteed: !!r.isGuaranteed, pool: _pn,
                        pool_id: window.__activePoolId || '',
                        id: t + '-' + Date.now() + '-' + Math.random().toString(36).slice(2, 7) });
                });
                if (historyRecords.length > 500) historyRecords = historyRecords.slice(-500);
                localStorage.setItem(STORAGE_KEY, JSON.stringify({ history: historyRecords }));

                // 如果历史弹窗打开，刷新列表
                if (document.getElementById('historyOverlay')?.classList.contains('open')) {
                    renderHistory(historyPage);
                }

                const hasFive = resp.results.some(item => item.rarity === 5);
                const videoFile = hasFive ? "gold.webm" : "none.webm";
                try { playVideo(videoFile, resp.results, resp.exchangeInfo || ""); } catch (e) {
                    console.warn("视频启动失败", e);
                    safeShowResult(resp.results, resp.exchangeInfo || "");
                    isGachaInProgress = false;
                }
            } catch (err) {
                console.error("抽卡回调报错", err);
                safeShowResult(resp?.results || [], resp?.exchangeInfo || "");
                isGachaInProgress = false;
            }
        };

        function safeShowResult(list, info) { try { showResults(list, info); } catch (e) { console.error(e); } }

        function getItemDisplayName(item) {
            if (item.type === 'custom' && item.id === 'none') {
                let n = '谢谢参与';
                if (item.amount && item.amount !== 0) n += ` ×${item.amount}`;
                return n;
            }
            let n = item.name || item.type || '未知';
            if (item.amount && item.amount !== 0) n += ` ×${item.amount}`;
            return n;
        }

        function getItemImageByType(item) {
            const base = 'imgs/';
            const map = {
                'clothes': { '26_Newyear': '24skin.png' },
                'star_rail_ticket': 'star_rail_ticket.png',
                'jade': 'stellar_jade.png',
                'cake': 'cake.png',
                'credit': 'credit.png',
                'none': 'none.png'
            };
            let f = 'unknown.png';
            if (item.type === 'clothes' && item.id) f = map.clothes[item.id] || 'clothes.png';
            else if (item.type === 'custom' && item.id) {
                // 自定义物品：客户端已把抽到展示图同步到页面目录 imgs/<id>.png
                const it = knownItem(item.id);
                if (it) f = item.id + '.png';
                else f = map.none || 'none.png';
            } else f = map[item.type] || 'none.png';
            return base + f;
        }

        function showResults(list, exchangeInfo) {
            console.log("【showResults】展示", list);
            const popupEl = getEl('gachaResultPopup');
            const inner = getEl('popupInner');
            if (!popupEl || !inner) return;
            popupEl.classList.remove('show');
            inner.innerHTML = '';
            let html = `<button class="close-btn" id="popupCloseBtn">✕</button>`;
            const count = list.length,
                isSingle = count === 1,
                gridClass = isSingle ? 'single' : 'ten';
            html += `<div class="result-grid ${gridClass}" id="popupResultGrid">`;
            for (let i = 0; i < list.length; i++) {
                try {
                    const item = list[i],
                        rarity = item.rarity ?? 3,
                        imgSrc = getItemImageByType(item),
                        displayName = getItemDisplayName(item);
                    html += `<div class="r-item rarity-${rarity}">
                        <img src="${imgSrc}" alt="${displayName}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
                        <span class="empty-placeholder" style="display:none">✦</span>
                        <div class="item-label">${displayName}</div>
                    </div>`;
                } catch (err) { html += `<div class="r-item"><span class="empty-placeholder">·</span></div>`; }
            }
            if (!isSingle && list.length < 10)
                for (let i = 0; i < 10 - list.length; i++) html += `<div class="r-item"><span class="empty-placeholder">·</span></div>`;
            html += `</div>`;
            if (exchangeInfo && exchangeInfo.trim()) html += `<div class="exchange-info">🔄 ${exchangeInfo}</div>`;
            else html += `<div class="exchange-info hidden"></div>`;
            inner.innerHTML = html;
            requestAnimationFrame(() => popupEl.classList.add('show'));
            const closeBtn = document.getElementById('popupCloseBtn');
            if (closeBtn) closeBtn.onclick = (e) => { e.stopPropagation();
                popupEl.classList.remove('show'); };
            popupEl.onclick = (e) => { if (e.target === popupEl) popupEl.classList.remove('show'); };
            const escH = (e) => { if (e.key === 'Escape' && popupEl.classList.contains('show')) { popupEl.classList.remove(
                        'show');
                    document.removeEventListener('keydown', escH); } };
            document.addEventListener('keydown', escH);
        }

        // ===== 视频播放 =====
        let _activeVideoPlay = false;

        function playVideo(filename, results, exchangeInfo) {
            if (_activeVideoPlay) { console.warn("视频已播放，忽略"); return; }
            _activeVideoPlay = true;
            console.log("🎬 开始播放视频:", filename);
            const v = document.getElementById('gachaVideo'),
                overlay = document.getElementById('videoOverlay'),
                app = document.getElementById('app'),
                skipBtn = document.getElementById('skipVideoBtn');
            if (!v || !overlay) { _activeVideoPlay = false;
                safeShowResult(results, exchangeInfo); return; }
            v.pause();
            v.removeAttribute('src');
            v.load();
            v.style.cssText =
                `position:fixed!important;left:0!important;top:0!important;width:100vw!important;height:100vh!important;object-fit:contain!important;z-index:9999!important;background:#000!important;display:block!important;visibility:visible!important;opacity:1!important;pointer-events:none!important`;
            v.src = 'videos/' + filename;
            v.load();
            let errorHandled = false;
            const closeVideo = (e) => {
                if (e) e.stopPropagation();
                if (errorHandled) return;
                errorHandled = true;
                v.pause();
                overlay.classList.remove('open');
                overlay.style.display = 'none';
                if (app) app.classList.remove('disabled');
                if (skipBtn) skipBtn.style.display = 'none';
                cleanup();
                _activeVideoPlay = false;
                safeShowResult(results, exchangeInfo);
                isGachaInProgress = false;
            };
            const onError = (e) => {
                if (errorHandled) return;
                errorHandled = true;
                console.warn("视频加载失败", e);
                v.removeEventListener('error', onError);
                overlay.classList.remove('open');
                overlay.style.display = 'none';
                if (app) app.classList.remove('disabled');
                if (skipBtn) skipBtn.style.display = 'none';
                _activeVideoPlay = false;
                safeShowResult(results, exchangeInfo);
                isGachaInProgress = false;
            };
            v.addEventListener('error', onError);
            const onLoaded = () => {
                console.log(`视频尺寸: ${v.videoWidth}x${v.videoHeight}`);
                if (v.videoWidth === 0 || v.videoHeight === 0) {
                    setTimeout(() => { if (!errorHandled && overlay.classList.contains('open')) closeVideo(); }, 800);
                }
            };
            v.addEventListener('loadedmetadata', onLoaded);
            overlay.classList.add('open');
            overlay.style.display = 'flex';
            if (app) app.classList.add('disabled');
            if (skipBtn) {
                skipBtn.style.display = 'block';
                skipBtn.style.cssText =
                    `position:fixed;top:24px;right:24px;z-index:99999;padding:10px 24px;background:rgba(0,0,0,0.8);border:2px solid rgba(255,255,255,0.5);border-radius:30px;color:#fff;font-size:16px;font-weight:bold;cursor:pointer;backdrop-filter:blur(6px);box-shadow:0 4px 20px rgba(0,0,0,0.6);letter-spacing:1px;pointer-events:auto;`;
            }
            let startPos = null;
            const onDown = e => { startPos = { x: e.clientX, y: e.clientY }; };
            const onUp = e => {
                if (!startPos) return;
                const dx = e.clientX - startPos.x,
                    dy = e.clientY - startPos.y;
                if (Math.sqrt(dx * dx + dy * dy) < 15) closeVideo(e);
                startPos = null;
            };
            const onEnded = () => closeVideo();
            const cleanup = () => {
                v.removeEventListener('ended', onEnded);
                v.removeEventListener('error', onError);
                v.removeEventListener('loadedmetadata', onLoaded);
                overlay.removeEventListener('pointerdown', onDown);
                overlay.removeEventListener('pointerup', onUp);
                if (skipBtn) skipBtn.removeEventListener('click', closeVideo);
            };
            v.addEventListener('ended', onEnded);
            overlay.addEventListener('pointerdown', onDown);
            overlay.addEventListener('pointerup', onUp);

        async function loadHistoryFromServer() {
            if (!gacha_bridge || !isBridgeReady) return;
            try {
                const hist = JSON.parse(await gacha_bridge.getHistory());
                const srv = (hist && hist.history) || [];
                if (!Array.isArray(srv) || !srv.length) return;
                // 服务端记录 + 本地记录 合并（去重由 getFilteredHistory 统一处理）：
                // 这样「抽卡记录」里能看到**所有卡池**的历史，而不只是本页面本地攒下的
                const seen = {};
                const merged = [];
                srv.concat(historyRecords || []).forEach(function (r) {
                    if (!r || typeof r !== 'object') return;
                    const key = r.id ||
                        [r.time || '', r.name || '', r.rarity || 3, r.pool || ''].join('|');
                    if (seen[key]) return;
                    seen[key] = 1;
                    merged.push(r);
                });
                historyRecords = merged;
                if (historyRecords.length > 800) historyRecords = historyRecords.slice(-800);
                localStorage.setItem(STORAGE_KEY, JSON.stringify({ history: historyRecords }));
            } catch (e) { console.error(e); }
        }

        function getFilteredHistory() {
            const now = Date.now();
            // 汇总所有卡池的记录：去重（同一条记录可能同时存在于本地与服务端）→ 按时间倒序 → 30 天内
            const seen = {};
            const all = [];
            (historyRecords || []).forEach(function (r) {
                if (!r || typeof r !== 'object') return;
                const key = r.id || [r.time || '', r.name || '', r.rarity || 3, r.pool || ''].join('|');
                if (seen[key]) return;
                seen[key] = 1;
                all.push(r);
            });
            const ts = function (r) {
                const t = Date.parse(String((r || {}).time || '').replace(' ', 'T'));
                return isNaN(t) ? 0 : t;
            };
            all.sort(function (a, b) { return ts(b) - ts(a); });   // 最近的在上
            return all.filter(function (r) { return ts(r) >= now - ONE_MONTH_MS; });
        }

        function renderHistory(page) {
            const listEl = document.getElementById('historyList');
            const emptyEl = document.querySelector('.history-body .empty-msg');
            const pageCur = document.getElementById('pageCurrent');
            const pageTot = document.getElementById('pageTotal');
            const prevBtn = document.getElementById('historyPrev');
            const nextBtn = document.getElementById('historyNext');
            if (!listEl) return;
            const filtered = getFilteredHistory();
            const sorted = filtered;   // getFilteredHistory 已去重并按时间倒序
            const total = sorted.length;
            const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
            historyPage = Math.max(1, Math.min(page, totalPages));
            const start = (historyPage - 1) * PAGE_SIZE;
            const pageData = sorted.slice(start, start + PAGE_SIZE);
            listEl.innerHTML = '';
            if (total === 0) { if (emptyEl) emptyEl.style.display = 'block';
                listEl.style.display = 'none'; } else { if (emptyEl) emptyEl.style.display = 'none';
                listEl.style.display = 'flex'; }
            pageData.forEach(item => {
                const div = document.createElement('div');
                div.className = 'history-item rarity-' + (item.rarity || 3);
                const left = document.createElement('span');
                left.style.display = 'flex';
                left.style.gap = '6px';
                const nameSpan = document.createElement('span');
                nameSpan.className = 'h-name';
                nameSpan.textContent = item.name;
                const tag = document.createElement('span');
                tag.className = 'h-tag';
                if (item.isGuaranteed) tag.textContent = '保底';
                else if (item.isUp) tag.textContent = 'UP';
                else tag.textContent = '常驻';
                left.appendChild(nameSpan);
                left.appendChild(tag);
                const right = document.createElement('span');
                right.style.display = 'flex';
                right.style.gap = '8px';
                const rt = document.createElement('span');
                rt.className = 'h-rarity';
                rt.textContent = item.rarity + '★';
                const t = document.createElement('span');
                t.className = 'h-time';
                t.textContent = item.time;
                right.appendChild(rt);
                right.appendChild(t);
                div.appendChild(left);
                div.appendChild(right);
                listEl.appendChild(div);
            });
            if (pageCur) pageCur.textContent = historyPage;
            if (pageTot) pageTot.textContent = totalPages;
            if (prevBtn) prevBtn.disabled = historyPage <= 1;
            if (nextBtn) nextBtn.disabled = historyPage >= totalPages;
        }

        // 同一按钮 0.8 秒内只响应 1 次；任意两个按钮之间也留 0.4 秒间隔，
        // 避免"1 秒点 N 次"把抽卡/兑换等操作刷爆（只拦真实用户点击，程序触发的 click 不受影响）
        (function () {
            const SAME_MS = 800, ANY_MS = 400;
            let lastEl = null, lastTs = 0;
            document.addEventListener('click', function (e) {
                if (e.isTrusted === false) return;          // 程序触发的 click 放行
                const t = e.target;
                const el = (t && t.closest)
                    ? t.closest('button, .gacha-btn, .btn-base, .pool-item, .gp-btn, .eb-btn')
                    : null;
                if (!el) return;
                const now = Date.now();
                const tooSoon = (el === lastEl && now - lastTs < SAME_MS) ||
                                (now - lastTs < ANY_MS);
                if (tooSoon) {
                    e.stopImmediatePropagation();
                    if (e.preventDefault) e.preventDefault();
                    return false;
                }
                lastEl = el;
                lastTs = now;
            }, true);
        })();

            let box = document.getElementById('gachaToast');
            if (!box) {
                box = document.createElement('div');
                box.id = 'gachaToast';
                box.className = 'gacha-toast';
                box.innerHTML = '<div class="gt-text"></div><div class="gt-bar"><div class="gt-fill"></div></div>';
                document.body.appendChild(box);
            }
            box.querySelector('.gt-text').textContent = text || '';
            box.classList.remove('error', 'ok');
            if (kind === 'error') box.classList.add('error');
            if (kind === 'ok') box.classList.add('ok');
            const bar = box.querySelector('.gt-bar');
            const fill = box.querySelector('.gt-fill');
            if (typeof progress === 'number' && progress >= 0) {
                bar.style.display = 'block';
                fill.style.opacity = '1';
                fill.style.width = Math.max(0, Math.min(100, progress)) + '%';
            } else if (progress === -1) {
                bar.style.display = 'block';
                fill.style.opacity = '.45';
                fill.style.width = '100%';
            } else {
                bar.style.display = 'none';
            }
            box.classList.add('show');
            if (kind !== 'progress') {
                clearTimeout(box._hideTimer);
                box._hideTimer = setTimeout(function () { box.classList.remove('show'); }, 4200);
            }
        };

                box.querySelector('.gc-text').textContent = text || '';
                box.querySelector('.gc-ok').textContent = okText || '确定';
                box.querySelector('.gc-cancel').textContent = cancelText || '取消';
                document.body.appendChild(box);
                let done = false;
                function finish(v) {
                    if (done) return;
                    done = true;
                    try { box.parentNode.removeChild(box); } catch (e) { box.style.display = 'none'; }
                    resolve(v);
                }
                box.querySelector('.gc-ok').addEventListener('click', function () { finish(true); });
                box.querySelector('.gc-cancel').addEventListener('click', function () { finish(false); });
                box.addEventListener('click', function (e) { if (e.target === box) finish(false); });

        function toLocalInputValue(d) {
            const p = n => String(n).padStart(2, '0');
            return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) +
                'T' + p(d.getHours()) + ':' + p(d.getMinutes());
        }

        function parseLocalTime(s) {
            if (!s) return null;
            const raw = String(s).trim();
            // 相对写法（30D / 30d / 30天 / 2h / 2H / 30m / 30分钟 / 1D12H）：从现在起算。
            // 以前只走 new Date()，相对写法一律 Invalid Date → 倒计时永远显示"永久"。
            const relRe = /^(?:\d+\s*(?:[dD]|days?|天|日|[hH]|hrs?|hours?|小时|时|[mM]|mins?|minutes?|分|分钟)\s*)+$/;
            if (relRe.test(raw)) {
                const unitRe = /(\d+)\s*([dD]|days?|天|日|[hH]|hrs?|hours?|小时|时|[mM]|mins?|minutes?|分|分钟)/g;
                let ms = 0, m2, hit = false;
                while ((m2 = unitRe.exec(raw)) !== null) {
                    hit = true;
                    const n = parseInt(m2[1], 10);
                    const u = m2[2];
                    if (/^(?:[dD]|days?|天|日)$/i.test(u)) ms += n * 86400000;
                    else if (/^(?:[hH]|hrs?|hours?|小时|时)$/i.test(u)) ms += n * 3600000;
                    else if (u === 'M') ms += n * 30 * 86400000;   // 大写 M = 月（与 Python 端一致）
                    else ms += n * 60000;                          // m/min/分/分钟
                }
                return hit ? new Date(Date.now() + ms) : null;
            }
            // Python 的 isoformat() 会产出 6 位小数秒（2026-11-14T11:55:09.471783+08:00），
            // JS 的 Date 只认最多 3 位 → 直接 Invalid Date，页面就会一直显示"永久"。
            // 所以先把小数秒截断到 3 位再解析。
            const t = raw.replace(' ', 'T').replace(/(\.\d{3})\d+/, '$1');
            const d = new Date(t);
            return isNaN(d.getTime()) ? null : d;
        }

        function fmtTime(d) {
            if (!d) return '';
            const p = n => String(n).padStart(2, '0');
            return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
        }

        function poolTimeShort(pool) {
            if (!pool) return '';
            const st = parseLocalTime(pool.start_time);
            const et = parseLocalTime(pool.end_time || pool.expiry);
            const now = Date.now();
            if (st && now < st.getTime()) return '未开启 ' + fmtTime(st);
            if (et) {
                const ms = et.getTime() - now;
                if (ms <= 0) return '已结束';
                const d = Math.floor(ms / 86400000);
                const h = Math.floor((ms % 86400000) / 3600000);
                const mi = Math.floor((ms % 3600000) / 60000);
                return '剩 ' + (d ? d + '天' : '') + h + '小时' + mi + '分';
            }
            return '永久';
        }
        window.poolTimeShort = poolTimeShort;

        // ===================== 卡池到期与剩余时间（精确到秒） =====================
        function poolEndTs(pool) {
            const et = parseLocalTime(pool && (pool.end_time || pool.expiry));
            return et ? et.getTime() : 0;
        }
        function isPoolExpired(pool) {
            const t = poolEndTs(pool);
            return !!t && t <= Date.now();          // 到点即视为已下架
        }
        window.isPoolExpired = isPoolExpired;

        // 可见卡池：编辑模式全显示（含未公开、未到期的）；玩家模式只显示"已公开且未到期"
        function visiblePools() {
            const all = window.__pools || [];
            if (window.__edit && window.__edit.on) return all;
            return all.filter(function (p) {
                return p.published !== false && !isPoolExpired(p);
            });
        }
        window.visiblePools = visiblePools;

        function fmtRemainMs(ms) {
            if (ms <= 0) return '已结束';
            const s = Math.floor(ms / 1000);
            const p2 = function (v) { return String(v).padStart(2, '0'); };
            const d = Math.floor(s / 86400);
            const h = Math.floor((s % 86400) / 3600);
            const m = Math.floor((s % 3600) / 60);
            return (d ? d + '天 ' : '') + p2(h) + ':' + p2(m) + ':' + p2(s % 60);
        }
        window.fmtRemainMs = fmtRemainMs;

        function updatePoolTimeBadge() {
            const el = document.getElementById('poolTimeBadge');
            if (!el) return;
            const pool = getActivePool();
            if (!pool) { el.textContent = '距离卡池结束还有:--'; return; }
            const st = parseLocalTime(pool.start_time);
            if (st && Date.now() < st.getTime()) {
                el.textContent = '距离卡池开始还有:' + fmtRemainMs(st.getTime() - Date.now());
                return;
            }
            const end = poolEndTs(pool);
            if (!end) { el.textContent = '距离卡池结束还有:永久'; return; }
            const ms = end - Date.now();
            el.textContent = '距离卡池结束还有:' + fmtRemainMs(ms);
        }

            inp.onchange = function () {
                const f = inp.files && inp.files[0];
                if (!f) return;
                const r = new FileReader();
                r.onload = function () {
                    const b64 = String(r.result);
                    const pid = String(window.__activePoolId || '');
                    // 待传图按"卡池"存：切池后保存不会把封面传错池子
                    window.__edit.pending[kind + '@' + pid] = b64;
                    // 同步写进池对象：校验（必须有封面）立即可通过、预览立即生效
                    const pool = getActivePool();
                    if (pool) {
                        if (kind === 'banner') pool.banner = b64;
                        else { pool.ui = pool.ui || {}; pool.ui[kind] = b64; }
                    }
                    // 立即本地预览
                    if (kind === 'banner') {
                        const box = document.getElementById('centerModal');
                        if (box) {
                            let img = box.querySelector('img');
                            if (!img) {
                                box.innerHTML = '<img alt="卡池封面">';
                                img = box.querySelector('img');
                            }
                            if (img) { img.src = b64; img.style.display = ''; }
                        }
                    } else {
                        const idx = (kind === 'res1') ? 1 : 2;
                        const img = document.querySelector(
                            '.res-top-right .res-item:nth-child(' + idx + ') img');
                        if (img) { img.src = b64; img.style.display = ''; }
                    }
                    window.__edit.dirty = true;
                    window.gachaNotice('已选择新' + (kind === 'banner' ? '封面' : '物品图标') +
                        '，点「保存并热更新」生效', 'info');
                };
                r.readAsDataURL(f);
            };
            inp.click();
        }

        function openPoolRenameCtx(pool, x, y) {
            const body =
                '<label style="display:block;margin-bottom:6px;">卡池名称：' +
                '<input id="ctxPoolName" type="text" style="width:100%;margin-top:4px;' +
                'background:rgba(255,255,255,.08);color:#eee;border:1px solid rgba(255,255,255,.2);' +
                'border-radius:6px;padding:4px;"></label>' +
                '<label style="display:block;">UP 名称（列表小字显示为「XX UP」）：' +
                '<input id="ctxUpName" type="text" style="width:100%;margin-top:4px;' +
                'background:rgba(255,255,255,.08);color:#eee;border:1px solid rgba(255,255,255,.2);' +
                'border-radius:6px;padding:4px;"></label>';
            openCtxMenu(x, y, '✏️ 重命名卡池', body, function (m) {
                const nm = (m.querySelector('#ctxPoolName').value || '').trim();
                const up = (m.querySelector('#ctxUpName').value || '').trim();
                if (nm) pool.name = nm;
                pool.up_name = up;
                window.__edit.dirty = true;
                renderPoolList();
                if (typeof applyPoolMeta === 'function') applyPoolMeta(pool);
                toast('已重命名：' + (nm || pool.id) +
                    (up ? '（' + up + ' UP）' : '') + '，点保存生效', 'ok');
            });
            const ni = document.getElementById('ctxPoolName');
            if (ni) ni.value = pool.name || '';
            const ui = document.getElementById('ctxUpName');
            if (ui) ui.value = pool.up_name || '';
        }
        window.openPoolRenameCtx = openPoolRenameCtx;

        function addPoolFromEdit() {
            const cur = getActivePool() || {};
            let p;
            try { p = JSON.parse(JSON.stringify(cur)); } catch (e) { p = {}; }
            p.id = 'pool_' + Date.now().toString(36);
            p.name = '新卡池 ' + ((window.__pools || []).length + 1);
            p.description = '点击这里修改描述';
            // 新卡池不继承上一池的封面/侧边封面（否则两个池共用同一张封面）
            delete p.banner;
            delete p.side_banner;
            delete p._local_banner;
            if (p.ui) { delete p.ui.banner; delete p.ui.side; }
            p.published = false;   // 新卡池默认未公开，配好封面/道具后再公开
            p.ui = p.ui || {};
            if (!p.ui.res1) p.ui.res1 = 'imgs/star_rail_ticket.png';
            if (!p.ui.res2) p.ui.res2 = 'imgs/stellar_jade.png';
            window.__pools.push(p);
            window.__activePoolId = p.id;
            selectPool(p.id);
            window.__edit.dirty = true;
            window.gachaNotice('已添加卡池「' + p.name + '」，编辑后点保存生效', 'info');
        }
        window.addPoolFromEdit = addPoolFromEdit;

        function deletePoolFromEdit(id) {
            if ((window.__pools || []).length <= 1) {
                window.gachaNotice('至少保留一个卡池', 'error');
                return;
            }
            const i = window.__pools.findIndex(function (p) { return p.id === id; });
            if (i < 0) return;
            window.__pools.splice(i, 1);
            window.__activePoolId = window.__pools[Math.max(0, i - 1)].id;
            selectPool(window.__activePoolId);
            window.__edit.dirty = true;
            window.gachaNotice('已删除卡池（点保存生效）', 'info');
        }
        window.deletePoolFromEdit = deletePoolFromEdit;

        function uploadPendingImages() {
            const jobs = [];
            Object.keys(window.__edit.pending).forEach(function (key) {
                // key 形如 'banner@<池id>'：按池归属上传，切池也不会传错
                const at = key.lastIndexOf('@');
                const kind = at >= 0 ? key.slice(0, at) : key;
                const pid = at >= 0 ? key.slice(at + 1) : String(window.__activePoolId || '');
                jobs.push(new Promise(function (resolve) {
                    let done = false;
                    const finish = function (ok) {
                        if (done) return;
                        done = true;
                        resolve(!!ok);
                    };
                    window.__edit.waiters[kind + '@' + pid] = finish;
                    try {
                        window.gacha_bridge.uploadPoolImage(pid, kind, window.__edit.pending[key]);
                    } catch (e) {
                        finish(false);
                    }
                    setTimeout(function () { finish(false); }, 15000);
                }));
            });
            return Promise.all(jobs);
        }

        function validateEdit(pool) {
            const missing = [];
            if (!String(pool.name || '').trim()) missing.push('卡池标题');
            if (!String(pool.description || '').trim()) missing.push('卡池描述');
            // 封面：已上传（/gacha_images/）、刚选择的预览图（data:）都算有
            const _b = String(pool.banner || '').trim();
            if (!_b) missing.push('卡池封面');
            const ui = pool.ui || {};
            if (!String(ui.res1 || '').trim()) missing.push('右上角物品 1');
            if (!String(ui.res2 || '').trim()) missing.push('右上角物品 2');
            return missing;
        }

        async function saveEdit() {
            if (!window.gacha_bridge || !isBridgeReady) {
                window.gachaNotice('桥接未就绪，稍后再试', 'error');
                return;
            }
            const pool = getActivePool();
            if (!pool) {
                window.gachaNotice('没有可保存的卡池', 'error');
                return;
            }
            const missing = validateEdit(pool);
            if (missing.length) {
                window.gachaNotice('以下必填项不能为空：' + missing.join('、'), 'error');
                return;
            }
            window.gachaNotice('正在保存…', 'progress', -1);
            if (Object.keys(window.__edit.pending).length) {
                await uploadPendingImages();
                window.__edit.pending = {};
            }
            try {
                window.gacha_bridge.submitGachaConfig(JSON.stringify({
                    config: {
                        pools: window.__pools,
                        active_pool: window.__activePoolId,
                        menu_id: window.__edit.menuId
                    }
                }));
            } catch (e) {
                window.gachaNotice('保存失败：' + e.message, 'error');
            }
        }
        window.saveEdit = saveEdit;

        window.setEditMode = function (on, menuId, allowed) {
            if (menuId) window.__edit.menuId = menuId;
            const enable = !!on && allowed !== false;
            window.__edit.on = enable;
            let bar = document.getElementById('editBar');
            if (enable && !bar) {
                bar = document.createElement('div');
                bar.id = 'editBar';
                bar.innerHTML =
                    '<span class="eb-title">🎨 编辑模式</span>' +
                    '<span class="eb-hint">点文字改文案 · 点图片换图 · 左侧 ＋ 加卡池</span>' +
                    '<button id="ebAdd" class="eb-btn">＋ 添加卡池</button>' +
                    '<button id="ebDel" class="eb-btn eb-danger">🗑 删除当前卡池</button>' +
                    '<button id="ebSave" class="eb-btn eb-primary">💾 保存并热更新</button>' +
                    '<button id="ebExit" class="eb-btn">✖ 退出编辑</button>';
                document.body.appendChild(bar);
                document.getElementById('ebAdd').onclick = addPoolFromEdit;
                document.getElementById('ebDel').onclick = function () {
                    deletePoolFromEdit(window.__activePoolId);
                };
                document.getElementById('ebSave').onclick = saveEdit;
                document.getElementById('ebExit').onclick = function () {
                    window.setEditMode(false);
                };
                window.gachaNotice('已进入编辑模式：改完点「保存并热更新」', 'info');
            } else if (!enable && bar) {
                bar.remove();
            }
            seedUiDefaults();
            if (enable) {
                buildTimePanel();
            } else {
                const _tp = document.getElementById('poolTimePanel');
                if (_tp) _tp.remove();
            }
            renderPoolList();
            applyEditDecorations();
            renderTimePanel();
            if (enable) window.gachaNotice('编辑模式已开启', 'info');
        };

        window.onConfigSaved = function (ok, reason) {
            if (ok) {
                window.__edit.dirty = false;
                window.gachaNotice('✅ 已保存，并向所有在线玩家热更新', 'ok');
            } else {
                window.gachaNotice('❌ 保存失败：' + (reason || '未知原因'), 'error');
            }
        };

        // 页面加载即绑定右上角点击（保证「点击可用」，不等编辑模式）
        try { bindResClick(); } catch (e) { }

        window.onImageUploaded = function (poolId, kind, url, ok, reason) {
            const key = kind + '@' + poolId;
            const w = window.__edit.waiters[key];
            if (w) {
                delete window.__edit.waiters[key];
                w(!!ok);
            }
            if (!ok) { window.gachaNotice('图片上传失败：' + (reason || ''), 'error'); return; }
            // 上传成功：把服务端返回的 URL 写回池对象，随后的保存才会带真实封面地址
            const pool = (window.__pools || []).find(function (p) { return p.id === poolId; });
            if (pool && url) {
                if (kind === 'banner') pool.banner = url;
                else { pool.ui = pool.ui || {}; pool.ui[kind] = url; }
            }
        };
</script>
</body>
</html>
